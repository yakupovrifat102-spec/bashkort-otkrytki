<!doctype html><html lang="ba"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Башҡортса ҡотлауҙар!</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#36105f,#85175f 55%,#d64b76);font-family:system-ui,sans-serif;color:white;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:22px 16px 60px}header{text-align:center;padding:22px 0}h1{font-size:29px;margin:8px 0}p{opacity:.9}.tag{display:inline-block;background:#ffffff25;border:1px solid #ffffff50;border-radius:40px;padding:8px 15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#ffffff17;border:1px solid #ffffff30;border-radius:22px;padding:22px 10px;text-align:center;cursor:pointer;box-shadow:0 8px 22px #23002230}.card .icon{font-size:46px}.card strong{display:block;margin:12px 0 5px;font-size:17px}.price{color:#ffe28d;font-weight:700}.panel{margin-top:18px;background:#ffffff18;border-radius:22px;padding:20px;display:none}.panel.show{display:block}.preview{position:relative;height:220px;border-radius:18px;background:radial-gradient(circle at 30% 20%,#ffe4b2,#f79cbd 40%,#8a4fd5);display:flex;align-items:center;justify-content:center;text-align:center;color:#5e1555;font-weight:900;font-size:27px;overflow:hidden}.preview:after{content:'ӨЛГӨ • ӨЛГӨ • ӨЛГӨ';position:absolute;transform:rotate(-25deg);font-size:24px;color:#ffffff99;text-shadow:0 1px 5px #3338;white-space:nowrap}button{width:100%;padding:15px;border:0;border-radius:15px;background:#ffe28d;color:#43135b;font-size:18px;font-weight:800;margin-top:15px}small{display:block;text-align:center;opacity:.8;margin-top:15px}</style></head><body><div class="wrap"><header><div class="tag">✨ Матур ҡотлауҙар донъяһы ✨</div><h1>Башҡортса ҡотлауҙар!</h1><p>Яҡындарығыҙға матур бүләк һайлағыҙ 💝</p></header><div class="grid"><div class="card" onclick="pick('🎂','Тыуған көнөң менән!')"><div class="icon">🎂</div><strong>Тыуған көн</strong><span class="price">100 ₽</span></div><div class="card" onclick="pick('💐','Юбилейың менән!')"><div class="icon">💐</div><strong>Юбилей</strong><span class="price">100 ₽</span></div><div class="card" onclick="pick('💍','Туй көнөгөҙ менән!')"><div class="icon">💍</div><strong>Туй</strong><span class="price">100 ₽</span></div><div class="card" onclick="pick('❤️','Иң изге теләктәр!')"><div class="icon">❤️</div><strong>Яҡындарға</strong><span class="price">100 ₽</span></div></div><section id="panel" class="panel"><div id="preview" class="preview"></div><button onclick="demo()">100 ₽ — Һатып алыу</button><small>Әлегә һынау режимы. Түләү алынмай.</small></section><small>© Башҡортса ҡотлауҙар! • Һынау өлгөһө</small></div><script>function pick(icon,title){document.getElementById('panel').classList.add('show');document.getElementById('preview').textContent=icon+' '+title;document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}function demo(){alert('Һынау режимы: түләү әлегә тоташтырылмаған.')} </script></body></html>
